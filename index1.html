<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-1BmE4kWBq78iYhFldvKuhfTAU6auU8tT94WrHftjDbrCEXSU1oBoqyl2QvZ6jIW3" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.8.1/font/bootstrap-icons.css">
    <script src="https://code.jquery.com/jquery-3.6.0.js" integrity="sha256-H+K7U5CnXl1h5ywQfKtSj8PCmoN9aaq30gDh27Xc0jk=" crossorigin="anonymous"></script>
    <title>VFT_TANK_LEVEL_TEST_PAGE</title>
  </head>
  <body>
    <style>
      .tk {
        position: relative;
        width: 40%;
        height: 100px;
        padding-top: 40px;
        margin: 0 auto;
        background: rgba(56, 56, 56, 0.8);
        border-radius: 100%/40px;
        border-bottom: 3px solid #000;
        text-align: center;
        z-index: 1;
        overflow: hidden;
      }

      .lq {
        position: absolute;
        background: rgba(52, 152, 219);
        width: 100%;
        height: 30px;
        bottom: 0;
        border-radius: 100%/40px;
        border-bottom: 3px solid #000;
      }

      .ring {
        position: absolute;
        border-radius: 100%;
        top: 0;
        width: 100%;
        height: 40%;
        content: '';
        border: 1px solid #000;
      }

      .text {
        display: block;
        position: absolute;
        top: 45%;
        left: 45%;
        z-index: 1;
      }

      .text1 {
        display: block;
        position: absolute;
        top: 5%;
        left: 35%;
        z-index: 1;
      }

      .tk:after, .tk .green {
        content: '';
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 20%;
        z-index: -1;
      }

      .tk .green {
        background: rgba(128, 128, 128, 0.99);
        height: 80%;
        top: -2px;
        border-radius: 100%/40px;
        border-bottom: 3px solid #000;
      }

      .tk:after {
        height: 20%;
        border: 1px solid #000;
        border-radius: 100%;
      }

      .myDiv {
        color: red;
      }

      .myDiv_run {
        color: red;
      }
    </style>

    <center>
      <p id="alarmText" style="color: #ffffff; background-color: #ff0000"></p>
      <p id="pumpText" style="color: #ffffff; background-color: #0066cc"></p>

      <script>
        const level = Number('{{VAR3}}');
        const alarmLevel = Number('{{VAR1}}');
        const psi = Number('{{VAR2}}');
        const fill = Math.max(0, Math.min(100, level));

        if (level < alarmLevel) {
          document.getElementById('alarmText').innerHTML = 'LOW WATER LEVEL ALARM';
        }

        if (psi < 40) {
          document.getElementById('pumpText').innerHTML = 'PUMP RUNNING';
        }

        $(document).ready(function() {
          $('.lq').animate({'height': fill + '%'}, 1000);
          $('.ring').css({ height: (100 - fill + 10) + '%' });
          $('.text').text(level + 'ft');
        });
      </script>

      <div class="tk">
        <h3 class="text">{{VAR3}}</h3>
        <h4 class="text1">Scale 0-100 Feet </h4>
        <div class="lq" data-amount="{{VAR3}}">
          <div class="ring"></div>
        </div>
      </div>

      <h1><i class="bi bi-droplet-fill"></i> Remote Tank Level <i class="bi bi-droplet-fill"></i></h1>
      <h3>Current water level is</h3>
      <h1>{{VAR3}} feet</h1>
      <h1>@ {{VAR2}} psi</h1>
      <p>Sccaled 0-100'</p>
      <p>Low Level Alarm Set at {{VAR1}}'</p>
      <p><a href="http://vftechserv.com">Created By VFTechinal Services</a></p>
    </center>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-ka7Sk0Gln4gmtz2MlQnikT1wXgYsOg+OMhuP+IlRH9sENBO0LRn5q+8nbTov4+1p" crossorigin="anonymous"></script>
  </body>
</html>
